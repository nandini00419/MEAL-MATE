{% extends "base.html" %}
{% block content %}
<div class="glass-panel max-w-2xl mx-auto p-10 rounded-[40px] relative overflow-hidden group border border-white/10">
    <div class="absolute -top-20 -right-20 w-60 h-60 bg-purple-500/10 blur-[100px] rounded-full"></div>
    <div class="absolute -bottom-20 -left-20 w-60 h-60 bg-blue-500/10 blur-[100px] rounded-full"></div>
    
    <div class="relative z-10">
        <h2 class="text-4xl font-black mb-2 text-white tracking-tight">Update Your Bio-Profile</h2>
        <p class="text-gray-400 mb-10 font-medium">Fine-tune your personal metrics to optimize your AI-generated health blueprint.</p>
        
        <form method="POST" action="" onsubmit="showLoader()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-purple-400 ml-1">Age</label>
                    <input type="number" name="age" value="{{ user.age or '' }}" required 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-purple-500/50 focus:ring-4 focus:ring-purple-500/10 transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-purple-400 ml-1">Gender</label>
                    <select name="gender" 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-purple-500/50 focus:ring-4 focus:ring-purple-500/10 transition-all appearance-none cursor-pointer">
                        <option {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-blue-400 ml-1">Weight (kg)</label>
                    <input type="number" step="0.1" name="weight" value="{{ user.weight or '' }}" required 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-blue-500/50 focus:ring-4 focus:ring-blue-500/10 transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-blue-400 ml-1">Height (cm)</label>
                    <input type="number" name="height" value="{{ user.height or '' }}" required 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-blue-500/50 focus:ring-4 focus:ring-blue-500/10 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-pink-400 ml-1">Primary Goal</label>
                    <select name="goal" 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-pink-500/50 focus:ring-4 focus:ring-pink-500/10 transition-all appearance-none cursor-pointer">
                        <option {% if user.goal == 'Lose weight' %}selected{% endif %}>Lose weight</option>
                        <option {% if user.goal == 'Gain muscle' %}selected{% endif %}>Gain muscle</option>
                        <option {% if user.goal == 'Maintain fitness' %}selected{% endif %}>Maintain fitness</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-widest text-pink-400 ml-1">Activity Level</label>
                    <select name="activity_level" 
                        class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-pink-500/50 focus:ring-4 focus:ring-pink-500/10 transition-all appearance-none cursor-pointer">
                        <option {% if user.activity_level == 'Sedentary' %}selected{% endif %}>Sedentary</option>
                        <option {% if user.activity_level == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option {% if user.activity_level == 'Active' %}selected{% endif %}>Active</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2 mb-6">
                <label class="block text-xs font-black uppercase tracking-widest text-cyan-400 ml-1">Dietary Focus</label>
                <select name="preferences" 
                    class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/10 transition-all appearance-none cursor-pointer">
                    <option {% if user.preferences == 'Any' %}selected{% endif %}>Any</option>
                    <option {% if user.preferences == 'Vegetarian' %}selected{% endif %}>Vegetarian</option>
                    <option {% if user.preferences == 'Vegan' %}selected{% endif %}>Vegan</option>
                    <option {% if user.preferences == 'Keto' %}selected{% endif %}>Keto</option>
                </select>
            </div>

            <div class="space-y-2 mb-10">
                <label class="block text-xs font-black uppercase tracking-widest text-cyan-400 ml-1">Allergies (Optional)</label>
                <input type="text" name="allergies" value="{{ user.allergies or '' }}" placeholder="e.g. Peanuts, Gluten" 
                    class="w-full px-5 py-4 bg-slate-900/50 border border-white/5 rounded-2xl text-white focus:outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/10 transition-all">
            </div>

            <div class="flex flex-col gap-4">
                <button type="submit" id="submit-btn" 
                    class="w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 rounded-2xl font-black text-lg text-white hover:shadow-[0_10px_40px_-10px_rgba(139,92,246,0.6)] transition-all active:scale-95 flex items-center justify-center gap-3">
                    <span id="btn-text">Save & Update AI Plan</span>
                    <svg id="loader-icon" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
                <a href="{{ url_for('dashboard') }}" class="text-center text-gray-500 font-bold hover:text-white transition-all text-sm uppercase tracking-widest">Back to Dashboard</a>
            </div>
        </form>
    </div>
</div>

<script>
    function showLoader() {
        const btn = document.getElementById('submit-btn');
        const span = document.getElementById('btn-text');
        const loader = document.getElementById('loader-icon');
        span.innerHTML = 'Optimizing Your Profile...';
        loader.classList.remove('hidden');
        btn.classList.add('opacity-80', 'cursor-not-allowed');
    }
</script>
{% endblock %}
