{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="glass-card w-full max-w-md p-10 rounded-[3rem] border border-slate-200 relative overflow-hidden group">
        <!-- Decoration -->
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-100 blur-[50px] rounded-full group-hover:bg-blue-200 transition-all"></div>
        
        <div class="relative z-10">
            <h2 class="text-4xl font-black text-slate-900 mb-2 text-center">New Entity</h2>
            <p class="text-slate-400 text-xs text-center mb-8 uppercase tracking-[0.2em] font-bold">Register your baseline biometrics</p>
            
            <form method="POST" action="" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Subject Name</label>
                    <input type="text" name="username" required placeholder="User_123"
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 focus:border-purple-500 transition-all outline-none">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Neural Email</label>
                    <input type="email" name="email" required placeholder="dna@protocol.ai"
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 focus:border-purple-500 transition-all outline-none">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">Access Key</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 focus:border-purple-500 transition-all outline-none">
                </div>
                <button type="submit" 
                        class="w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 rounded-2xl font-black text-xs uppercase tracking-[0.4em] text-white hover:shadow-[0_10px_30px_rgba(147,51,234,0.2)] transition-all active:scale-95">
                    Forge Account
                </button>
            </form>
            
            <p class="mt-8 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                Existing Entity? <a href="{{ url_for('login') }}" class="text-blue-600 hover:text-blue-700 transition-all underline decoration-2 underline-offset-4">Resume Session</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
