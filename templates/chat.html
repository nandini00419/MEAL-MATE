{% extends "base.html" %}
{% block content %}
<style>
    .glass-panel { background: rgba(255,255,255,0.76); backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,0.24); box-shadow: 0 12px 35px rgba(15,23,42,0.08); }
    .quick-chip { transition: all .2s ease; }
    .quick-chip:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(15,23,42,0.1); }
    .msg-in { animation: in .35s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="glass-panel h-[85vh] overflow-hidden rounded-3xl flex flex-col">
    <div class="border-b border-slate-200 bg-gradient-to-r from-emerald-50 to-cyan-50 p-6">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="flex h-12 w-12 items-center justify-center rounded-full bg-emerald-600 text-xl text-white">AI</div>
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Nutrition Assistant</h2>
                    <p class="text-xs uppercase tracking-wider text-slate-500">Ask focused health and cooking questions</p>
                </div>
            </div>
            <a href="{{ url_for('dashboard') }}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Back to Dashboard</a>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
            <button class="quick-chip rounded-full border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700" onclick="askQuick('Suggest a high protein breakfast under 450 calories')">High protein breakfast</button>
            <button class="quick-chip rounded-full border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700" onclick="askQuick('How should I split carbs, protein and fat for my goal?')">Macro split for my goal</button>
            <button class="quick-chip rounded-full border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700" onclick="askQuick('Create a simple dinner from ingredients I have at home')">Dinner from ingredients</button>
            <button class="quick-chip rounded-full border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700" onclick="askQuick('How do I reduce evening cravings?')">Control cravings</button>
            <button class="quick-chip rounded-full border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700" onclick="askQuick('Give me hydration tips for the full day')">Hydration tips</button>
        </div>
    </div>

    <div id="large-chat-messages" class="flex-1 space-y-6 overflow-y-auto p-6">
        <div class="msg-in flex max-w-3xl gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-600 text-xs font-bold text-white">AI</div>
            <div class="rounded-2xl rounded-tl-none border border-slate-200 bg-white p-4 text-slate-700">
                Hi {{ user.username }}, ask me meal planning, calories, hydration, macros, or a dish cooking method.
            </div>
        </div>
    </div>

    <div id="typing" class="hidden px-6 py-2">
        <div class="flex gap-1">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-bounce"></span>
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-bounce" style="animation-delay:.15s"></span>
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-bounce" style="animation-delay:.3s"></span>
        </div>
    </div>

    <div class="border-t border-slate-200 bg-white p-4">
        <div class="flex gap-2">
            <input id="large-chat-input" type="text" placeholder="Ask something specific..." class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeypress="if(event.key === 'Enter') sendNexusMessage()">
            <button onclick="sendNexusMessage()" class="rounded-xl bg-emerald-600 px-5 py-3 font-semibold text-white hover:bg-emerald-700">Send</button>
        </div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('large-chat-messages');
    const chatInput = document.getElementById('large-chat-input');
    const typingIndicator = document.getElementById('typing');

    function askQuick(question) {
        chatInput.value = question;
        sendNexusMessage();
    }

    async function sendNexusMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;

        // User message
        chatMessages.innerHTML += `
            <div class="msg-in flex gap-3 max-w-3xl ml-auto flex-row-reverse">
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-700 text-xs font-bold text-white">YOU</div>
                <div class="rounded-2xl rounded-tr-none bg-emerald-600 p-4 text-white shadow">
                    ${msg}
                </div>
            </div>
        `;
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Show typing
        typingIndicator.classList.remove('hidden');

        try {
            const resp = await fetch('/ai_nutritionist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await resp.json();
            
            typingIndicator.classList.add('hidden');
            
            // AI Response
            chatMessages.innerHTML += `
                <div class="msg-in flex gap-3 max-w-3xl">
                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-600 text-xs font-bold text-white">AI</div>
                    <div class="rounded-2xl rounded-tl-none border border-slate-200 bg-white p-4 text-slate-700 shadow-sm">
                        ${data.reply}
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch (e) {
            typingIndicator.classList.add('hidden');
            console.error(e);
        }
    }
</script>
{% endblock %}
